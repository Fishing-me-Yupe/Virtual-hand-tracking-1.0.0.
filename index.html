<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Virtual Hand - Cylinders</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    video {
      position: absolute;
      left: 0;
      top: 0;
      width: 320px;
      height: 240px;
      opacity: 0.3;
      z-index: 1;
      transform: scaleX(-1);
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<video id="webcam" autoplay playsinline></video>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";
import { GUI } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/libs/lil-gui.module.min.js";

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";


// =======================
// Config / GUI Settings
// =======================

const config = {
  colorHand1: "#00ffff",
  colorHand2: "#ff00ff",
  thickness: 0.025
};

const gui = new GUI();

gui.addColor(config, "colorHand1").name("右手/1手目の色").onChange(v => {
  handsData[0].material.color.set(v);
});

gui.addColor(config, "colorHand2").name("左手/2手目の色").onChange(v => {
  handsData[1].material.color.set(v);
});

gui.add(config, "thickness", 0.005, 0.08, 0.001).name("線の太さ");


// =======================
// Three.js Setup
// =======================

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

camera.position.z = 2;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(0, 1, 2);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);


// =======================
// 手の接続関係
// =======================

const HAND_CONNECTIONS = [
  // 親指
  [0, 1], [1, 2], [2, 3], [3, 4],
  // 人差し指
  [0, 5], [5, 6], [6, 7], [7, 8],
  // 中指
  [9, 10], [10, 11], [11, 12],
  // 薬指
  [13, 14], [14, 15], [15, 16],
  // 小指
  [0, 17], [17, 18], [18, 19], [19, 20],
  // 手のひら
  [5, 9], [9, 13], [13, 17]
];


// =======================
// 太い線（円柱）の生成
// =======================

const MAX_HANDS = 2;
const handsData = [];

// 再利用する円柱ジオメトリ（高さ1の単位円柱）
const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, 12);
// 原点を底面に合わせることで伸縮時の位置計算を容易化
cylinderGeometry.translate(0, 0.5, 0);
cylinderGeometry.rotateX(Math.PI / 2);

for (let h = 0; h < MAX_HANDS; h++) {

  const material = new THREE.MeshStandardMaterial({
    color: h === 0 ? config.colorHand1 : config.colorHand2,
    roughness: 0.3,
    metalness: 0.2
  });

  const bones = [];

  for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
    const mesh = new THREE.Mesh(cylinderGeometry, material);
    mesh.visible = false;
    scene.add(mesh);
    bones.push(mesh);
  }

  handsData.push({ bones, material });
}


// =======================
// Webcam & MediaPipe
// =======================

const video = document.getElementById("webcam");
const stream = await navigator.mediaDevices.getUserMedia({ video: true });
video.srcObject = stream;

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(
  vision,
  {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    runningMode: "VIDEO",
    numHands: 2
  }
);


// =======================
// Render Loop
// =======================

let lastVideoTime = -1;

async function render() {

  if (video.readyState >= 2) {

    if (lastVideoTime !== video.currentTime) {

      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(
        video,
        performance.now()
      );

      // 非表示初期化
      for (let h = 0; h < MAX_HANDS; h++) {
        handsData[h].bones.forEach(b => b.visible = false);
      }

      if (results.landmarks) {

        for (let h = 0; h < results.landmarks.length && h < MAX_HANDS; h++) {

          const landmarks = results.landmarks[h];
          const hand = handsData[h];

          // 3D座標の抽出
          const positions = landmarks.map(p => new THREE.Vector3(
            -(p.x - 0.5) * 2.5,
            -(p.y - 0.5) * 2,
            -p.z * 2
          ));

          // 各接続（骨格）を更新
          for (let i = 0; i < HAND_CONNECTIONS.length; i++) {

            const [startIndex, endIndex] = HAND_CONNECTIONS[i];
            const startPos = positions[startIndex];
            const endPos = positions[endIndex];

            const bone = hand.bones[i];

            // 距離（長さ）の計算
            const distance = startPos.distanceTo(endPos);

            if (distance > 0) {
              // 1. 位置の設定
              bone.position.copy(startPos);

              // 2. 向きの設定（始点から終点へ向かせる）
              bone.lookAt(endPos);

              // 3. スケールの設定（太さと長さを適用）
              bone.scale.set(
                config.thickness,
                config.thickness,
                distance
              );

              bone.visible = true;
            }
          }
        }
      }
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(render);
}

render();

</script>
</body>
</html>

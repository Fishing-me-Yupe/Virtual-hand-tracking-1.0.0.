<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Hand Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2127; --muted: #626b77; --line: #dfe3e8;
    --accent: #2f6df6; --accent-fg: #ffffff; --field: #eef0f3; --stage: #14171b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101215; --panel: #1a1d22; --fg: #e8eaee; --muted: #98a1ad; --line: #2a2f36;
      --accent: #5b8cff; --accent-fg: #0b1020; --field: #23272e; --stage: #0b0c0e; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
  #wrap { min-height: 0; min-width: 0; display: grid; place-items: center; background: var(--stage); }
  #stage { position: relative; overflow: hidden; background: #1d2127; width: 640px; height: 480px; }
  #video, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #video { object-fit: fill; }
  #hud { position: absolute; left: 10px; top: 8px; color: #fff; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; opacity: .75; text-shadow: 0 1px 2px #000a; pointer-events: none; white-space: pre; }
  #msg { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px; color: #e8eaee; background: #0008; }
  #msg p { margin: 0; max-width: 34em; }
  #msg[hidden] { display: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 11px; margin: 0 0 8px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  section { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; }
  .row label { color: var(--fg); }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button, select, .btn { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
  button:hover { filter: brightness(1.06); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .chk { display: flex; align-items: center; gap: 8px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
  .sw[aria-pressed=true] { box-shadow: 0 0 0 2px var(--accent); }
  details { border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  .fgrid { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; align-items: center; margin-top: 8px; font-size: 12px; }
  .fgrid .hd { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  @media (max-width: 820px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; height: auto; }
    #wrap { height: calc(100vw / var(--ar, 1.3333)); }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
  <main id="wrap">
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="gl"></canvas>
      <div id="hud"></div>
      <div id="msg">
        <p id="msgText">読み込み中…</p>
        <div class="btns" id="msgBtns" style="justify-content:center"></div>
      </div>
    </div>
  </main>

  <aside>
    <h1>3D Hand Tracker</h1>

    <section>
      <h2>入力</h2>
      <div class="btns">
        <button id="btnCam" class="primary" type="button">カメラを開始</button>
        <button id="btnDemo" type="button">デモ動作</button>
      </div>
      <label class="chk"><input type="checkbox" id="c_mirror"> 鏡のように左右反転して表示</label>
      <label class="chk"><input type="checkbox" id="c_video"> カメラ映像を背景に表示</label>
      <label class="chk"><input type="checkbox" id="c_swap"> 左右の判定を入れ替える</label>
      <div class="row"><label for="c_complexity">検出モデル</label>
        <select id="c_complexity" style="grid-column: 2 / 4"><option value="0">軽量 (速い)</option><option value="1">標準 (高精度)</option></select></div>
      <div id="sl_smooth"></div>
    </section>

    <section>
      <h2>肌と輪郭</h2>
      <div class="swatches" id="swatches"></div>
      <div class="row"><label for="c_skin">肌の色</label><span><input type="color" id="c_skin"></span><output></output></div>
      <div id="sl_shade"></div>
      <label class="chk"><input type="checkbox" id="c_outline"> 輪郭線</label>
      <div id="sl_outlineW"></div>
      <div class="row"><label for="c_outlineColor">輪郭の色</label><span><input type="color" id="c_outlineColor"></span><output></output></div>
    </section>

    <section>
      <h2>指</h2>
      <div id="sl_size"></div>
      <div id="sl_len"></div>
      <div id="sl_th"></div>
      <label class="chk"><input type="checkbox" id="c_fit"> 自分の指の長さに合わせる</label>
      <details>
        <summary>指ごとの長さ・太さ</summary>
        <div class="fgrid" id="fgrid"></div>
      </details>
    </section>

    <section>
      <h2>その他</h2>
      <div id="sl_fov"></div>
      <div class="btns">
        <label class="btn">手のGLBを読み込む<input type="file" id="fileGlb" accept=".glb" hidden></label>
        <button id="btnExport" type="button">設定を保存</button>
        <label class="btn">設定を読み込む<input type="file" id="fileCfg" accept=".json" hidden></label>
        <button id="btnReset" type="button">初期値に戻す</button>
      </div>
      <p class="note">骨のないメッシュなので、読み込み時に指ごとのスキンウェイトを自動生成し、GPUで変形します。毎フレームの計算は16本のボーン行列だけです。</p>
    </section>
  </aside>
</div>

<script>
/*
 * hand_core.js  -  three.js 非依存の計算コア
 *   1. GLB パーサ (build_hands.py の出力専用)
 *   2. 骨格 (build_hands.py の build_finger の移植)
 *   3. スキンウェイトの自動生成 (読み込み時に1回だけ)
 *   4. MediaPipe のランドマーク -> 16本のボーン行列 (毎フレーム、ほぼ無料)
 *
 * ボーン番号: 0 = 手のひら(手首含む) / 1 + 3*f + k = 指 f (0=thumb..4=pinky) の第 k 節 / 16 = 親指付け根の補助
 * 単位は m。メッシュの座標系: 指先 +Y / 手の甲 +Z / 右手の親指は -X。
 */
(function (root) {
  'use strict';

  const FINGERS = ['thumb', 'index', 'middle', 'ring', 'pinky'];
  const NBONES = 17;               // 0 手のひら / 1..15 指 / 16 親指の付け根 (手のひらと第1節の中間の動きをする補助ボーン)

  // ---- build_hands.py と同じ基準形状 (cm) ----
  const FINGER_BASE = {
    index:  { base: [-0.86, 7.30, -0.1], L: [3.11, 2.03, 1.62], R: [0.84, 0.78, 0.72, 0.6],  splay: 0.04, cf: 0.80 },
    middle: { base: [0.83, 6.95, -0.1],  L: [3.83, 2.5, 2.0],   R: [0.86, 0.8, 0.73, 0.6],   splay: 0.23, cf: 1.00 },
    ring:   { base: [2.33, 6.45, -0.1],  L: [3.52, 2.29, 1.84], R: [0.8, 0.74, 0.68, 0.57],  splay: 0.44, cf: 1.15 },
    pinky:  { base: [3.25, 5.93, -0.1],  L: [2.71, 1.77, 1.41], R: [0.72, 0.66, 0.6, 0.5],   splay: 0.87, cf: 1.30 },
  };
  const THUMB = { base: [-1.90, 1.20, -0.4], L: [3.90, 2.40, 1.50], R: [1.2, 1.08, 0.94, 0.74],
                  yaw: [42, 50, 42], flex: [5, 3, 3] };
  const FLEX_FULL = [25, 40, 25];

  const DEFAULT_PARAMS = {
    hand_scale: 1.0, palm_width: 0.92, palm_length: 0.88, length_scale: 1.2, thickness_scale: 0.82,
    curl: 0.04, spread: 1.0, thumb_spread: 1.0, shade_strength: 0.4, outline_width_cm: 0.035,
    skin_color: '#FBECE4', outline_color: '#0d0d0d',
    fingers: {
      thumb: { length: 0.88, thickness: 0.85 }, index: { length: 1, thickness: 1 },
      middle: { length: 1, thickness: 1 }, ring: { length: 1, thickness: 1 }, pinky: { length: 1, thickness: 1 },
    },
  };

  // ---- 小さなベクトル/行列ユーティリティ (配列, 行優先3x3) ----
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const matVec = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
  const transpose = (M) => [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]];
  function matMul(A, B) {
    const C = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
    return C;
  }
  function rotBetween(u, w) {            // u -> w の最小回転
    const c = dot(u, w);
    if (c < -0.99999) {
      const ax = norm(cross(u, Math.abs(u[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]));
      return [2 * ax[0] * ax[0] - 1, 2 * ax[0] * ax[1], 2 * ax[0] * ax[2],
              2 * ax[1] * ax[0], 2 * ax[1] * ax[1] - 1, 2 * ax[1] * ax[2],
              2 * ax[2] * ax[0], 2 * ax[2] * ax[1], 2 * ax[2] * ax[2] - 1];
    }
    const v = cross(u, w), k = 1 / (1 + c);
    const vx = [0, -v[2], v[1], v[2], 0, -v[0], -v[1], v[0], 0];
    const vx2 = matMul(vx, vx);
    const R = new Array(9);
    for (let i = 0; i < 9; i++) R[i] = (i % 4 === 0 ? 1 : 0) + vx[i] + k * vx2[i];
    return R;
  }
  function rotPow(Q, t) {                // 回転 Q の t 乗 (t=0.5 で半分だけ回る)
    const c = Math.max(-1, Math.min(1, (Q[0] + Q[4] + Q[8] - 1) / 2)), ang = Math.acos(c);
    const ax = [Q[7] - Q[5], Q[2] - Q[6], Q[3] - Q[1]], l = len(ax);
    if (ang < 1e-6 || l < 1e-9) return [1, 0, 0, 0, 1, 0, 0, 0, 1];
    const a = mul(ax, 1 / l), th = ang * t, cs = Math.cos(th), sn = Math.sin(th), k = 1 - cs;
    return [cs + k * a[0] * a[0], k * a[0] * a[1] - sn * a[2], k * a[0] * a[2] + sn * a[1],
            k * a[1] * a[0] + sn * a[2], cs + k * a[1] * a[1], k * a[1] * a[2] - sn * a[0],
            k * a[2] * a[0] - sn * a[1], k * a[2] * a[1] + sn * a[0], cs + k * a[2] * a[2]];
  }
  function eulerMat(rx, ry, rz) {
    const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry), cz = Math.cos(rz), sz = Math.sin(rz);
    const X = [1, 0, 0, 0, cx, -sx, 0, sx, cx], Y = [cy, 0, sy, 0, 1, 0, -sy, 0, cy], Z = [cz, -sz, 0, sz, cz, 0, 0, 0, 1];
    return matMul(Z, matMul(Y, X));
  }

  // ---------------------------------------------------------------------------
  // GLB パーサ
  // ---------------------------------------------------------------------------
  function parseGLB(buf) {
    const dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('GLBではありません');
    const jl = dv.getUint32(12, true);
    const gltf = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jl)));
    const binOff = 20 + jl + 8;
    const view = (acc, Type, comps) => {
      const a = gltf.accessors[acc], bv = gltf.bufferViews[a.bufferView];
      const off = binOff + (bv.byteOffset || 0) + (a.byteOffset || 0);
      return new Type(buf.slice(off, off + a.count * comps * Type.BYTES_PER_ELEMENT));
    };
    const params = (gltf.asset && gltf.asset.extras && gltf.asset.extras.params) || null;
    const hands = {};
    gltf.meshes.forEach((m) => {
      const side = /_L$/.test(m.name) ? 'L' : 'R';
      const skin = m.primitives[0];
      const outl = m.primitives.find((p, i) => i > 0 && !p.attributes.NORMAL);
      const h = {
        pos: view(skin.attributes.POSITION, Float32Array, 3),
        nor: view(skin.attributes.NORMAL, Float32Array, 3),
        col: skin.attributes.COLOR_0 !== undefined ? view(skin.attributes.COLOR_0, Float32Array, 3) : null,
        idx: view(skin.indices, Uint32Array, 1),
        ow: null,
      };
      const n = h.pos.length / 3;
      h.ow = new Float32Array(n);
      if (outl) {                                  // 輪郭用メッシュ = 頂点を法線方向に押し出したもの。幅だけ取り出す
        const ov = view(outl.attributes.POSITION, Float32Array, 3);
        for (let i = 0; i < n; i++) h.ow[i] = Math.hypot(ov[3 * i] - h.pos[3 * i], ov[3 * i + 1] - h.pos[3 * i + 1], ov[3 * i + 2] - h.pos[3 * i + 2]);
      } else h.ow.fill(0.00035);
      if (!h.col) { h.col = new Float32Array(n * 3).fill(1); }
      hands[side] = h;
    });
    return { params, hands };
  }

  // ---------------------------------------------------------------------------
  // 骨格 (build_hands.py: build_finger の移植)。メートルに変換し、左手なら X を反転
  // ---------------------------------------------------------------------------
  function buildSkeleton(userParams, left) {
    const P = Object.assign({}, DEFAULT_PARAMS, userParams || {});
    P.fingers = Object.assign({}, DEFAULT_PARAMS.fingers, (userParams && userParams.fingers) || {});
    const k = 0.01 * P.hand_scale, deg = Math.PI / 180;
    const fx = left ? -1 : 1;
    const fingers = FINGERS.map((name) => {
      const f = P.fingers[name];
      const ls = Array.isArray(f.length) ? f.length : [f.length, f.length, f.length];
      const thick = f.thickness * P.thickness_scale;
      let spec, L, splays, flexCum;
      const cum = (a) => { let s = 0; return a.map((x) => (s += x)); };
      if (name === 'thumb') {
        spec = THUMB;
        L = [0, 1, 2].map((i) => spec.L[i] * ls[i] * P.length_scale);
        splays = spec.yaw.map((y) => -y * P.thumb_spread * deg);
        flexCum = cum(spec.flex.map((a) => (a + 20 * P.curl) * deg));
      } else {
        spec = FINGER_BASE[name];
        L = [0, 1, 2].map((i) => spec.L[i] * ls[i] * P.length_scale);
        const sp = spec.splay * P.spread;
        splays = [sp, sp, sp];
        flexCum = cum(FLEX_FULL.map((a) => a * P.curl * spec.cf * deg));
      }
      const base = [spec.base[0] * P.palm_width, spec.base[1] * P.palm_length, spec.base[2]];
      const R = spec.R.map((x) => x * thick);
      const pts = [base], dirs = [];
      for (let i = 0; i < 3; i++) {
        const d = norm([Math.sin(splays[i]) * Math.cos(flexCum[i]), Math.cos(splays[i]) * Math.cos(flexCum[i]), -Math.sin(flexCum[i])]);
        dirs.push(d);
        pts.push(add(pts[i], mul(d, L[i])));
      }
      const m = (v) => [v[0] * k * fx, v[1] * k, v[2] * k];
      const mp = pts.map(m), md = dirs.map((d) => [d[0] * fx, d[1], d[2]]);
      const Lm = [0, 1, 2].map((i) => len(sub(mp[i + 1], mp[i])));
      return { name, pts: mp, dirs: md, R: R.map((x) => x * k), L: Lm, total: Lm[0] + Lm[1] + Lm[2] };
    });
    // 手首 (ランドマーク0 に相当) と、手のひらの基準フレーム
    const wrist = [0.3 * P.palm_width * k * fx, 0.2 * k, 0];
    const bases = [1, 2, 3, 4].map((i) => fingers[i].pts[0]);   // index, middle, ring, pinky
    const frame = frameFrom(wrist, bases[0], bases[1], bases[2], bases[3], left);
    return {
      left, fingers, wrist, frame,
      span: len(sub(bases[0], bases[3])),
      palmLen: len(sub(frame.o, wrist)),
    };
  }

  // 手のひらの座標系。X = 小指側 (左手は親指側), Y = 手首->指の付け根, Z = X x Y = 手の甲側
  function frameFrom(w, i, m, r, p, left) {
    const mc = mul(add(add(i, m), add(r, p)), 0.25);
    const X = norm(left ? sub(i, p) : sub(p, i));
    let Y = sub(mc, w);
    Y = norm(sub(Y, mul(X, dot(Y, X))));
    return { o: mc, B: [X, Y, cross(X, Y)] };
  }
  function rotFromFrames(Bt, Br) {       // Bt の各軸 <- Br の各軸 に移す回転
    const R = new Array(9).fill(0);
    for (let c = 0; c < 3; c++) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) R[i * 3 + j] += Bt[c][i] * Br[c][j];
    return R;
  }

  // ---------------------------------------------------------------------------
  // スキンウェイト自動生成。各頂点を「いちばん近い指の軸 (カプセル)」に割り当て、
  // 指の軸方向の位置 s から 手のひら / 第1 / 第2 / 第3 節 へ滑らかに配分する。
  // 戻り値: skinIndex(Uint16 x4), skinWeight(Float32 x4)。スロット順は [palm, seg0, seg1, seg2]
  // ---------------------------------------------------------------------------
  function computeWeights(pos, skel) {
    const n = pos.length / 3;
    const idx = new Uint16Array(n * 4), wt = new Float32Array(n * 4), rc = new Float32Array(n * 4);
    const F = skel.fingers;
    const ratio = new Float64Array(5), sArr = new Float64Array(5), cp = new Float64Array(15);
    const infl = (f) => 1 - smooth(f === 0 ? 1.25 : 1.45, f === 0 ? 2.6 : 2.1, ratio[f]);
    // 手のひら -> 指の切り替え幅。親指は、軸の近く (親指そのもの) では狭く、母指球 (軸から遠い膨らみ) では広く緩やかにして、
    // 親指の動きに母指球が引きずられて段差や裂け目ができないようにする
    const base = (f) => {
      const R0 = F[f].R[0], th = f === 0;
      const w0 = th ? R0 * (1.4 + 1.8 * smooth(1.2, 2.2, ratio[f])) : R0 * 1.2;
      return infl(f) * smooth(-w0, w0, sArr[f]) * (th ? 1 - 0.35 * smooth(1.3, 2.0, ratio[f]) : 1);
    };
    for (let v = 0; v < n; v++) {
      const px = pos[3 * v], py = pos[3 * v + 1], pz = pos[3 * v + 2];
      for (let f = 0; f < 5; f++) {                      // 指ごとに、軸 (3節のカプセル) までの最短を求める
        const fg = F[f];
        let best = 1e9, bs = 0, cumL = 0;
        for (let k = 0; k < 3; k++) {
          const a = fg.pts[k], b = fg.pts[k + 1];
          const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
          const t = ((px - a[0]) * bx + (py - a[1]) * by + (pz - a[2]) * bz) / (fg.L[k] * fg.L[k]);
          const tc = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = a[0] + bx * tc, qy = a[1] + by * tc, qz = a[2] + bz * tc;
          const dx = px - qx, dy = py - qy, dz = pz - qz;
          const r = fg.R[k] + (fg.R[k + 1] - fg.R[k]) * tc;
          const ra = Math.sqrt(dx * dx + dy * dy + dz * dz) / r;
          if (ra < best) { best = ra; bs = cumL + t * fg.L[k]; cp[3 * f] = qx; cp[3 * f + 1] = qy; cp[3 * f + 2] = qz; }
          cumL += fg.L[k];
        }
        ratio[f] = best; sArr[f] = bs;
      }
      let A = 0; for (let f = 1; f < 5; f++) if (ratio[f] < ratio[A]) A = f;
      let B = -1; for (let f = 0; f < 5; f++) if (f !== A && (B < 0 || ratio[f] < ratio[B])) B = f;
      const fa = F[A], fb = F[B];
      const FA = base(A), FB = base(B);
      const j1 = fa.L[0], j2 = fa.L[0] + fa.L[1];
      const wA = smooth(j1 - fa.R[1] * 1.3, j1 + fa.R[1] * 1.3, sArr[A]);
      const wB = smooth(j2 - fa.R[2] * 1.3, j2 + fa.R[2] * 1.3, sArr[A]);
      // 付け根付近の「指と指の間」は、両側の指の第1節で滑らかに分け合う (片方に固定すると曲げたときに裂ける)
      const shareA = smooth(-0.5, 0.5, ratio[B] - ratio[A]);
      let sb = (1 - shareA) * (1 - smooth(0.35 * j1, 0.7 * j1, sArr[A])) * (1 - smooth(0.35 * fb.L[0], 0.7 * fb.L[0], sArr[B]));
      if (wA > 1e-4) sb = 0;
      const cA = FA * (1 - sb), cB = FB * sb;
      const o = 4 * v, a0 = 1 + 3 * A, b0 = 1 + 3 * B;
      // 親指は 手のひら -> 付け根の補助ボーン(半分だけ回る) -> 第1節 と段階的に移る (母指球が一気に引きずられて段差になるのを防ぐ)
      let wp, wt16 = 0, wseg;
      if (A === 0) { const a = smooth(0, 0.7, cA), bb = smooth(0.4, 1.0, cA); wp = 1 - a - cB; wt16 = a - bb; wseg = bb; }
      else { wp = 1 - cA - cB; wseg = cA; }
      const list = [[0, Math.max(wp, 0)], [16, wt16], [a0, wseg * (1 - wA)]];
      if (sb > 0) list.push([b0, cB]); else { list.push([a0 + 1, wseg * (wA - wB)]); list.push([a0 + 2, wseg * wB]); }
      list.sort((p, q) => (q[1] > 1e-6 ? 1 : 0) - (p[1] > 1e-6 ? 1 : 0));         // 重みのあるものを先頭へ (最大4つ)
      let tot = 0; for (let j = 0; j < 4; j++) tot += list[j][1];
      for (let j = 0; j < 4; j++) { idx[o + j] = list[j][1] > 1e-6 ? list[j][0] : 0; wt[o + j] = list[j][1] > 1e-6 ? list[j][1] / tot : 0; }
      // 体積補正用: 軸から頂点へのベクトル (休止姿勢) と、補正の強さ
      // 補正は指の胴体だけに効かせる。付け根の手前・指と指の間 (隣の指の軸に切り替わる場所) では 0 にして、継ぎ目を作らない
      const thumbA = A === 0;
      const body = 1 - smooth(thumbA ? 1.5 : 1.15, thumbA ? 2.2 : 1.5, ratio[A]);
      const kk = body * smooth(0, 0.8 * fa.R[0], sArr[A]) * (1 - 2 * sb);
      rc[o] = px - cp[3 * A]; rc[o + 1] = py - cp[3 * A + 1]; rc[o + 2] = pz - cp[3 * A + 2]; rc[o + 3] = kk;
    }
    return { idx, wt, rc };
  }

  // ---------------------------------------------------------------------------
  // MediaPipe の出力 -> カメラ空間 (m, three.js と同じ向き: +X 右 / +Y 上 / -Z 奥)
  //   img: 正規化画像座標 [{x,y}], wld: ワールドランドマーク [{x,y,z}] (m, 手の中心原点)
  //   奥行きは「手のひら周りの実寸 / 画像上の長さ」から推定する
  // ---------------------------------------------------------------------------
  function camSpace(img, wld, o) {
    const ty = Math.tan(o.fovY * Math.PI / 360), mx = o.mirror ? -1 : 1;
    const segs = [[0, 5], [0, 9], [0, 13], [0, 17], [5, 9], [9, 13], [13, 17], [5, 17]];
    let sw = 0, sp = 0;
    for (const [a, b] of segs) {
      sw += Math.hypot(wld[a].x - wld[b].x, wld[a].y - wld[b].y);
      sp += Math.hypot((img[a].x - img[b].x) * o.aspect * 2 * ty, (img[a].y - img[b].y) * 2 * ty);
    }
    const z = Math.min(2.5, Math.max(0.12, sw / Math.max(sp, 1e-6)));
    const set = [0, 5, 9, 13, 17];
    let cx = 0, cy = 0, wx = 0, wy = 0, wz = 0;
    for (const i of set) { cx += img[i].x; cy += img[i].y; wx += wld[i].x; wy += wld[i].y; wz += wld[i].z; }
    cx /= 5; cy /= 5; wx /= 5; wy /= 5; wz /= 5;
    const C = [mx * (2 * cx - 1) * o.aspect * ty * z, (1 - 2 * cy) * ty * z, -z];
    const P = new Float64Array(63);
    for (let i = 0; i < 21; i++) {
      P[3 * i] = C[0] + mx * (wld[i].x - wx);
      P[3 * i + 1] = C[1] - (wld[i].y - wy);
      P[3 * i + 2] = C[2] - (wld[i].z - wz);
    }
    return P;
  }

  // ---------------------------------------------------------------------------
  // ポーズ -> ボーン行列。P はカメラ空間の 21 点 (Float64Array(63))
  //   o = { size, len, th, fLen[5], fTh[5], fit }   st = 呼び出し間で持ち回る状態 ({} でよい)
  //   out の各ボーン: 列優先 4x4。メッシュ(休止姿勢)の頂点にそのまま掛ければ現在の姿勢になる
  // ---------------------------------------------------------------------------
  function put(out, b, M3, t) {
    const o = b * 16;
    for (let r = 0; r < 3; r++) { for (let c = 0; c < 3; c++) out[o + c * 4 + r] = M3[r * 3 + c]; out[o + 12 + r] = t[r]; out[o + 3 + 4 * r] = 0; }
    out[o + 15] = 1;
  }
  function solve(P, skel, o, st, out) {
    out = out || new Float32Array(NBONES * 16);
    const g = (i) => [P[3 * i], P[3 * i + 1], P[3 * i + 2]];
    const Ft = frameFrom(g(0), g(5), g(9), g(13), g(17), skel.left);
    const Rp = rotFromFrames(Ft.B, skel.frame.B);
    const spT = 0.5 * (len(sub(g(5), g(17))) / skel.span + len(sub(Ft.o, g(0))) / skel.palmLen);
    st.sp = st.sp ? st.sp + (spT - st.sp) * 0.1 : spT;
    const sp = st.sp * o.size;
    // 手のひらボーン
    const Mp = Rp.map((x) => x * sp);
    const orr = matVec(Mp, skel.frame.o);
    put(out, 0, Mp, sub(Ft.o, orr));
    st.sf = st.sf || [0, 0, 0, 0, 0];
    for (let f = 0; f < 5; f++) {
      const fg = skel.fingers[f];
      const lm = f === 0 ? 1 : 5 + 4 * (f - 1);          // 付け根のランドマーク番号 (親指は CMC)
      // 指の実寸に合わせた倍率 (ゆっくり追従させて、ランドマークのゆらぎで伸び縮みしないようにする)
      let trk = 0;
      for (let k = 0; k < 3; k++) trk += len(sub(g(lm + k + 1), g(lm + k)));
      const sfT = o.fit ? trk / fg.total * o.size : sp;
      st.sf[f] = st.sf[f] ? st.sf[f] + (sfT - st.sf[f]) * 0.05 : sfT;
      const sf = st.sf[f];
      const lenF = o.len * o.fLen[f], thF = o.th * o.fTh[f];
      let A = add(matVec(Mp, sub(fg.pts[0], skel.frame.o)), Ft.o);
      // 各節の向き。指 (親指以外) の第2・第3関節は蝶番として扱う:
      //  ・曲げの面 (指の横軸に垂直な面) の外へのブレを取り除く
      //  ・曲げ角を人の指の範囲に収める (ランドマークの先端側のふらつきで、関節が不自然に折れないように)
      const Ds = [norm(sub(g(lm + 1), g(lm)))];
      if (f > 0) {
        const D0 = Ds[0], pw = mul(Ft.B[2], -1);
        // 蝶番の軸 = 休止姿勢での「指に垂直で手のひらの面内にある向き」を、第1節の回転で現在の姿勢へ移したもの
        const hr = norm(cross(fg.dirs[0], [0, 0, 1]));
        const R0 = matMul(rotBetween(matVec(Rp, fg.dirs[0]), D0), Rp);
        const hax = norm(matVec(R0, hr));
        const lim = [[-0.35, 1.95], [-0.3, 1.55]];
        for (let k = 1; k < 3; k++) {
          let D = norm(sub(g(lm + k + 1), g(lm + k)));
          D = sub(D, mul(hax, dot(D, hax) * 0.85));
          D = len(D) > 1e-4 ? norm(D) : Ds[k - 1];
          const Dp = Ds[k - 1];
          const ax = mul(hax, Math.sign(dot(cross(hax, Dp), pw)) || 1);        // +回転 = 手のひら側へ曲がる向き
          let th = Math.atan2(dot(cross(Dp, D), ax), dot(Dp, D));
          th = Math.min(lim[k - 1][1], Math.max(lim[k - 1][0], th));
          const c = Math.cos(th), sn = Math.sin(th), cr = cross(ax, Dp), dt = dot(ax, Dp) * (1 - c);
          Ds.push(norm([Dp[0] * c + cr[0] * sn + ax[0] * dt, Dp[1] * c + cr[1] * sn + ax[1] * dt, Dp[2] * c + cr[2] * sn + ax[2] * dt]));
        }
      } else {
        Ds.push(norm(sub(g(lm + 2), g(lm + 1))), norm(sub(g(lm + 3), g(lm + 2))));
      }
      // 回転は節から節へ「ねじれなし」で受け渡す (手のひらを基準に毎回つくり直すと、隣り合う節がねじれて関節で断面が合わなくなる)
      let Rk = Rp;
      for (let k = 0; k < 3; k++) {
        const D = Ds[k], d = fg.dirs[k];
        Rk = matMul(rotBetween(matVec(Rk, d), D), Rk);
        // 休止姿勢での異方スケール: 軸方向に lenF、断面に thF
        // 太さは手のひらと指の倍率の中間 (指の長さに合わせて細くなりすぎないように)
        const tb = Math.sqrt(sp * sf) * thF, a = tb, b = sf * lenF - tb;
        const S = [a + b * d[0] * d[0], b * d[0] * d[1], b * d[0] * d[2],
                   b * d[1] * d[0], a + b * d[1] * d[1], b * d[1] * d[2],
                   b * d[2] * d[0], b * d[2] * d[1], a + b * d[2] * d[2]];
        const M3 = matMul(Rk, S);
        put(out, 1 + 3 * f + k, M3, sub(A, matVec(M3, fg.pts[k])));
        if (f === 0 && k === 0) {          // 親指付け根の補助ボーン: 手のひらと第1節の中間の回転、付け根を支点にする
          const Mh = matMul(rotPow(matMul(Rk, transpose(Rp)), 0.5), Rp).map((x) => x * tb);
          put(out, 16, Mh, sub(add(matVec(Mp, sub(fg.pts[0], skel.frame.o)), Ft.o), matVec(Mh, fg.pts[0])));
        }
        A = add(A, mul(D, fg.L[k] * sf * lenF));
      }
    }
    return { M: out, sp };
  }

  // 検証用の CPU スキニング。シェーダーと同じ式 (rc を渡すと体積補正が入る)
  function applySkin(pos, idx, wt, M, out, rc) {
    const n = pos.length / 3;
    out = out || new Float32Array(pos.length);
    for (let v = 0; v < n; v++) {
      const x = pos[3 * v], y = pos[3 * v + 1], z = pos[3 * v + 2];
      const rx = rc ? rc[4 * v] : 0, ry = rc ? rc[4 * v + 1] : 0, rz = rc ? rc[4 * v + 2] : 0, k = rc ? rc[4 * v + 3] : 0;
      let ox = 0, oy = 0, oz = 0, cx = 0, cy = 0, cz = 0, el = 0;
      for (let j = 0; j < 4; j++) {
        const w = wt[4 * v + j]; if (w === 0) continue;
        const m = idx[4 * v + j] * 16;
        ox += w * (M[m] * x + M[m + 4] * y + M[m + 8] * z + M[m + 12]);
        oy += w * (M[m + 1] * x + M[m + 5] * y + M[m + 9] * z + M[m + 13]);
        oz += w * (M[m + 2] * x + M[m + 6] * y + M[m + 10] * z + M[m + 14]);
        if (k > 0) {
          const ax = x - rx, ay = y - ry, az = z - rz;
          cx += w * (M[m] * ax + M[m + 4] * ay + M[m + 8] * az + M[m + 12]);
          cy += w * (M[m + 1] * ax + M[m + 5] * ay + M[m + 9] * az + M[m + 13]);
          cz += w * (M[m + 2] * ax + M[m + 6] * ay + M[m + 10] * az + M[m + 14]);
          el += w * Math.hypot(M[m] * rx + M[m + 4] * ry + M[m + 8] * rz, M[m + 1] * rx + M[m + 5] * ry + M[m + 9] * rz, M[m + 2] * rx + M[m + 6] * ry + M[m + 10] * rz);
        }
      }
      if (k > 0) {
        const dx = ox - cx, dy = oy - cy, dz = oz - cz, f = Math.min(el / Math.max(Math.hypot(dx, dy, dz), 1e-7), 2.2);
        ox += (cx + dx * f - ox) * k; oy += (cy + dy * f - oy) * k; oz += (cz + dz * f - oz) * k;
      }
      out[3 * v] = ox; out[3 * v + 1] = oy; out[3 * v + 2] = oz;
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // デモ用の合成ポーズ (カメラなしで確認するため)。curl は指ごとに 0(開)〜1(握り)
  // ---------------------------------------------------------------------------
  function synthHand(skel, curl, g) {
    const pts = new Array(21);
    pts[0] = skel.wrist.slice();
    const ang = [85, 100, 60].map((a) => a * Math.PI / 180);
    for (let f = 0; f < 5; f++) {
      const fg = skel.fingers[f], lm = f === 0 ? 1 : 5 + 4 * (f - 1);
      const c = curl[f], th = f === 0;
      let p = fg.pts[0].slice(), phi = 0;
      pts[lm] = p;
      for (let k = 0; k < 3; k++) {
        phi += c * ang[k] * (th ? [0.3, 0.55, 0.6][k] : 1);
        const d = fg.dirs[k];
        const dn = [d[0], d[1] * Math.cos(phi) + d[2] * Math.sin(phi), -d[1] * Math.sin(phi) + d[2] * Math.cos(phi)];
        p = add(p, mul(dn, fg.L[k]));
        pts[lm + k + 1] = p;
      }
    }
    const R = eulerMat(g.rx, g.ry, g.rz), P = new Float64Array(63);
    for (let i = 0; i < 21; i++) {
      const q = add(matVec(R, mul(sub(pts[i], skel.frame.o), g.scale)), g.pos);
      P[3 * i] = q[0]; P[3 * i + 1] = q[1]; P[3 * i + 2] = q[2];
    }
    return P;
  }

  // ---------------------------------------------------------------------------
  // One Euro フィルタ (ランドマークのブレ取り。速い動きには遅れず、止まっているときは安定)
  // ---------------------------------------------------------------------------
  function OneEuro(n, minCut, beta) {
    this.n = n; this.minCut = minCut || 1.5; this.beta = beta || 10; this.dCut = 1;
    this.x = null; this.dx = new Float64Array(n);
  }
  OneEuro.prototype.reset = function () { this.x = null; };
  OneEuro.prototype.filter = function (v, t) {          // v: Float64Array(n) を書き換える。t: 秒
    if (!this.x) { this.x = Float64Array.from(v); this.t = t; this.dx.fill(0); return v; }
    const dt = Math.max(t - this.t, 1e-3); this.t = t;
    const al = (c) => 1 / (1 + 1 / (2 * Math.PI * c) / dt);
    const ad = al(this.dCut);
    for (let i = 0; i < this.n; i++) {
      const d = (v[i] - this.x[i]) / dt;
      this.dx[i] += (d - this.dx[i]) * ad;
      const a = al(this.minCut + this.beta * Math.abs(this.dx[i]));
      this.x[i] += (v[i] - this.x[i]) * a;
      v[i] = this.x[i];
    }
    return v;
  };

  const api = { FINGERS, NBONES, DEFAULT_PARAMS, parseGLB, buildSkeleton, computeWeights, camSpace, solve, applySkin, synthHand, OneEuro };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.HandCore = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(async function () {

  const FNAMES = ['親指', '人差し指', '中指', '薬指', '小指'];

  const SLIDERS = [
    { key: 'smooth', label: '手ブレ補正', min: 0, max: 1, step: 0.01 },
    { key: 'shade', label: '影の濃さ', min: 0, max: 1, step: 0.01 },
    { key: 'outlineW', label: '輪郭の太さ', min: 0, max: 4, step: 0.05 },
    { key: 'size', label: '手のサイズ', min: 0.5, max: 1.6, step: 0.01 },
    { key: 'len', label: '指の長さ (全体)', min: 0.5, max: 1.6, step: 0.01 },
    { key: 'th', label: '指の太さ (全体)', min: 0.5, max: 1.6, step: 0.01 },

  // ------------------------------------------------------------------ UI
  const ui = { sliders: {} };
  function makeSlider(host, def, getV, setV) {

    const inp = document.createElement('input'); inp.type = 'range'; inp.id = 's_' + def.key;

    inp.addEventListener('input', () => { setV(parseFloat(inp.value)); show(); changed(def.key); });

  FNAMES.forEach((name, i) => {
    const n = document.createElement('span'); n.textContent = name; fgrid.append(n);
    [['fLen', '長さ'], ['fTh', '太さ']].forEach(([key, lab]) => {
      const inp = document.createElement('input'); inp.type = 'range'; inp.min = 0.5; inp.max = 1.6; inp.step = 0.01;
      inp.id = `s_${key}_${i}`; inp.setAttribute('aria-label', name + lab); inp.value = S[key][i];
      inp.addEventListener('input', () => { S[key][i] = parseFloat(inp.value); changed(key); });
      ui.sliders[`${key}_${i}`] = () => { inp.value = S[key][i]; };
      fgrid.append(inp);
    });
  });

  const sw = $('swatches');
  SKINS.forEach((c) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = c; b.title = c; b.setAttribute('aria-label', '肌の色 ' + c);
    b.addEventListener('click', () => { S.skin = c; syncUI(); changed('skin'); });
    sw.append(b);
  });
  const checks = { mirror: 'c_mirror', video: 'c_video', swap: 'c_swap', outline: 'c_outline', fit: 'c_fit' };
  Object.entries(checks).forEach(([k, id]) => $(id).addEventListener('change', (e) => { S[k] = e.target.checked; changed(k); }));
  $('c_skin').addEventListener('input', (e) => { S.skin = e.target.value; syncUI(); changed('skin'); });
  $('c_outlineColor').addEventListener('input', (e) => { S.outlineColor = e.target.value; changed('outlineColor'); });
  $('c_complexity').addEventListener('change', (e) => { S.complexity = parseInt(e.target.value, 10); changed('complexity'); });

  function syncUI() {
    Object.entries(checks).forEach(([k, id]) => { $(id).checked = !!S[k]; });
    $('c_skin').value = S.skin; $('c_outlineColor').value = S.outlineColor; $('c_complexity').value = String(S.complexity);
    Object.values(ui.sliders).forEach((f) => f());
    [...sw.children].forEach((b) => b.setAttribute('aria-pressed', String(b.title.toLowerCase() === S.skin.toLowerCase())));
  }

  // ------------------------------------------------------------------ 状態
  let THREE = null, renderer, scene, camera;
  let aspect = 4 / 3, dirty = true;
  const hn = {};                       // 'R' / 'L' -> 手のデータ
  const opts = { size: 1, len: 1, th: 1, fLen: S.fLen, fTh: S.fTh, fit: true };
  let glbParams = null;
  let demo = false, camOn = false;

  function setMsg(text, buttons) {
    $('msg').hidden = !text; $('msgText').textContent = text || '';
    const host = $('msgBtns'); host.textContent = '';
    (buttons || []).forEach(([label, fn, primary]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (primary) b.className = 'primary';
      b.addEventListener('click', fn); host.append(b);
    });
  }
  function save() { try { localStorage.setItem('handtracker.settings', JSON.stringify(S)); } catch (e) { /* 無視 */ } }
  let saveTimer = 0;
  function changed(key) {
    opts.size = S.size; opts.len = S.len; opts.th = S.th; opts.fit = S.fit; opts.fLen = S.fLen; opts.fTh = S.fTh;
    for (const h of Object.values(hn)) {
      h.filter.minCut = 4 * (1 - S.smooth) + 0.4;
      h.skinMat.color.set(S.skin);
      h.outMat.color.set(S.outlineColor);
      h.outMesh.visible = S.outline && h.skinMesh.visible;
    }
    if (key === 'shade' || key === 'all') updateShade();
    if (camera && (key === 'fov' || key === 'all')) { camera.fov = S.fov; camera.updateProjectionMatrix(); }
    if (key === 'mirror' || key === 'all') $('video').style.transform = S.mirror ? 'scaleX(-1)' : '';
    if (key === 'video' || key === 'all') $('video').style.visibility = S.video ? 'visible' : 'hidden';
    if (key === 'complexity' && mp) mp.setOptions({ modelComplexity: S.complexity });
    if (key === 'mirror' || key === 'swap') for (const h of Object.values(hn)) h.lastSeen = -1;
    dirty = true;
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 300);
  }

  // ------------------------------------------------------------------ three.js / メッシュ
  async function loadThree() {
    for (const u of THREE_URLS) { try { return await import(u); } catch (e) { console.warn('three.js load failed', u, e); } }
    throw new Error('three.js を読み込めませんでした。ネットワーク接続を確認してください。');
  }
  function setupScene() {
    renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true, powerPreference: 'low-power' });
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(S.fov, aspect, 0.02, 5);
  }
  // スキニングの差し替え (頂点シェーダー)。
  //  ・通常の線形ブレンドは、曲げた関節で断面が痩せる (絞り出したように細くなる)。
  //  ・rc = (指の軸から頂点へのベクトル, 補正の強さ)。ブレンド後も「軸からの距離」を元の太さに戻す。
  //  ・outline のときは、さらに法線方向へ押し出して輪郭線にする (反転ハル法)。
  const SKIN_GLSL = `
#ifdef USE_SKINNING
{
  vec4 k_pv = bindMatrix * vec4( transformed, 1.0 );
  vec4 k_pc = bindMatrix * vec4( transformed - rc.xyz, 1.0 );
  vec4 k_sv = boneMatX * k_pv * skinWeight.x + boneMatY * k_pv * skinWeight.y + boneMatZ * k_pv * skinWeight.z + boneMatW * k_pv * skinWeight.w;
  vec4 k_sc = boneMatX * k_pc * skinWeight.x + boneMatY * k_pc * skinWeight.y + boneMatZ * k_pc * skinWeight.z + boneMatW * k_pc * skinWeight.w;
  float k_el = length( mat3( boneMatX ) * rc.xyz ) * skinWeight.x + length( mat3( boneMatY ) * rc.xyz ) * skinWeight.y
             + length( mat3( boneMatZ ) * rc.xyz ) * skinWeight.z + length( mat3( boneMatW ) * rc.xyz ) * skinWeight.w;
  vec3 k_rr = k_sv.xyz - k_sc.xyz;
  vec3 k_res = mix( k_sv.xyz, k_sc.xyz + k_rr * min( k_el / max( length( k_rr ), 1e-7 ), 2.2 ), rc.w );
  transformed = ( bindMatrixInverse * vec4( k_res, 1.0 ) ).xyz;
}
#endif`;
  function patchSkin(sh, outline) {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec4 rc;' + (outline ? '\nattribute float ow;\nuniform float uOutW;' : ''))
      .replace('#include <skinning_vertex>', SKIN_GLSL + (outline ? '\n#ifdef USE_SKINNING\ntransformed += normalize( objectNormal ) * ow * uOutW;\n#endif' : ''));
  }
  function disposeHands() {
    for (const h of Object.values(hn)) {
      scene.remove(h.skinMesh, h.outMesh);
      h.geom.dispose(); h.skinMat.dispose(); h.outMat.dispose(); h.skeleton.dispose && h.skeleton.dispose();
    }
    for (const k of Object.keys(hn)) delete hn[k];
  }
  function buildHands(buf) {
    const g = HC.parseGLB(buf);
    if (!g.hands.R || !g.hands.L) throw new Error('右手と左手のメッシュが見つかりません');
    glbParams = g.params;
    disposeHands();
    const k0 = (g.params && g.params.shade_strength !== undefined) ? g.params.shade_strength : 0.4;
    for (const side of ['R', 'L']) {
      const d = g.hands[side], skel = HC.buildSkeleton(g.params, side === 'L');
      const w = HC.computeWeights(d.pos, skel);
      const n = d.pos.length / 3;
      // 焼き込み済みの影 (頂点カラー) から影の強さ t を逆算しておく → 影の濃さスライダーで再計算できる
      const t = new Float32Array(n), shG0 = 1 - k0 * 0.23;
      for (let i = 0; i < n; i++) t[i] = k0 < 0.02 ? 1 : Math.min(1, Math.max(0, (d.col[3 * i + 1] - shG0) / (1 - shG0)));
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(d.pos, 3));
      geom.setAttribute('normal', new THREE.BufferAttribute(d.nor, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(d.col), 3));
      geom.setAttribute('ow', new THREE.BufferAttribute(d.ow, 1));
      geom.setAttribute('rc', new THREE.BufferAttribute(w.rc, 4));
      geom.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(w.idx, 4));
      geom.setAttribute('skinWeight', new THREE.Float32BufferAttribute(w.wt, 4));
      geom.setIndex(new THREE.BufferAttribute(d.idx, 1));

      const bones = [], inv = [];
      for (let i = 0; i < HC.NBONES; i++) { bones.push(new THREE.Bone()); inv.push(new THREE.Matrix4()); }
      const skeleton = new THREE.Skeleton(bones, inv);
      const skinMat = new THREE.MeshBasicMaterial({ vertexColors: true, color: S.skin });
      const ou = { value: 0.0004 };
      const outMat = new THREE.MeshBasicMaterial({ color: S.outlineColor, side: THREE.BackSide });
      skinMat.onBeforeCompile = (sh) => patchSkin(sh, false);
      skinMat.customProgramCacheKey = () => 'handSkin';
      outMat.onBeforeCompile = (sh) => { sh.uniforms.uOutW = ou; patchSkin(sh, true); };
      outMat.customProgramCacheKey = () => 'handOutline';
      const skinMesh = new THREE.SkinnedMesh(geom, skinMat), outMesh = new THREE.SkinnedMesh(geom, outMat);
      for (const m of [skinMesh, outMesh]) { m.frustumCulled = false; m.bind(skeleton, new THREE.Matrix4()); m.visible = false; scene.add(m); }
      hn[side] = { side, skel, geom, bones, skeleton, skinMat, outMat, skinMesh, outMesh, ou, t, n,
                   M: new Float32Array(HC.NBONES * 16), st: {}, sp: 1, lastSeen: -1,
                   filter: new HC.OneEuro(63, 4 * (1 - S.smooth) + 0.4, 10) };
    }
    changed('all');
    dirty = true;
  }
  function updateShade() {
    for (const h of Object.values(hn)) {
      const col = h.geom.attributes.color, a = col.array, k = S.shade;
      const s0 = 1 - k * 0.10, s1 = 1 - k * 0.23, s2 = 1 - k * 0.20;
      for (let i = 0; i < h.n; i++) {
        const t = h.t[i];
        a[3 * i] = s0 + (1 - s0) * t; a[3 * i + 1] = s1 + (1 - s1) * t; a[3 * i + 2] = s2 + (1 - s2) * t;
      }
      col.needsUpdate = true;
    }
  }

  // ------------------------------------------------------------------ ポーズ適用
  function applyPose(h, P, now) {
    const r = HC.solve(P, h.skel, opts, h.st, h.M);
    h.sp = r.sp; h.lastSeen = now; h.fresh = true;
  }
  function onResults(r) {
    const now = performance.now() / 1000;
    const L = r.multiHandLandmarks || [], W = r.multiHandWorldLandmarks || [], Hd = r.multiHandedness || [];
    const used = {};
    for (let i = 0; i < L.length; i++) {
      if (!W[i]) continue;
      // 鏡像でない生の映像を渡しているので、MediaPipe のラベルは実際の手と逆になる
      let right = !(Hd[i] && Hd[i].label === 'Right');
      if (S.swap) right = !right;
      const leftMesh = (!right) !== S.mirror;
      const side = leftMesh ? 'L' : 'R';
      const h = hn[side];
      if (!h || used[side]) continue;
      used[side] = true;
      const P = HC.camSpace(L[i], W[i], { aspect, fovY: S.fov, mirror: S.mirror });
      if (now - h.lastSeen > 0.5) h.filter.reset();
      h.filter.filter(P, now);
      applyPose(h, P, now);
    }
    detCount++; dirty = true;
  }

  // デモ用: カメラなしで見た目を確認する
  function stepDemo(now) {
    for (const side of ['R', 'L']) {
      const h = hn[side]; if (!h) continue;
      const ph = side === 'R' ? 0 : 1.7;
      const curl = [0, 1, 2, 3, 4].map((i) => { const c = 0.5 + 0.5 * Math.sin(now * 1.5 + ph + i * 0.55); return i === 0 ? c * 0.8 : c; });
      const g = { rx: -0.25 + 0.2 * Math.sin(now * 0.7 + ph), ry: (side === 'R' ? -1 : 1) * (0.5 + 0.4 * Math.sin(now * 0.45 + ph)),
                  rz: 0.15 * Math.sin(now * 0.6), scale: 0.62, pos: [side === 'R' ? 0.1 : -0.1, 0, -0.45] };
      applyPose(h, HC.synthHand(h.skel, curl, g), now);
    }
    dirty = true;
  }

  // ------------------------------------------------------------------ 描画ループ
  let frames = 0, detCount = 0, hudT = 0, detMs = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts / 1000;
    if (demo && ts - (frame.last || 0) > 30) { frame.last = ts; stepDemo(now); }
    for (const h of Object.values(hn)) {
      const vis = h.lastSeen >= 0 && (now - h.lastSeen) < 0.3;
      if (vis !== h.skinMesh.visible) { h.skinMesh.visible = vis; h.outMesh.visible = vis && S.outline; dirty = true; }
    }
    if (dirty) {
      dirty = false;
      for (const h of Object.values(hn)) {
        if (!h.skinMesh.visible) continue;
        for (let i = 0; i < HC.NBONES; i++) h.bones[i].matrixWorld.fromArray(h.M, i * 16);
        h.ou.value = S.outlineW * h.sp;
      }
      renderer.render(scene, camera);
      frames++;
    }
    if (now - hudT > 0.5) {
      const dt = now - hudT; hudT = now;
      $('hud').textContent = `描画 ${(frames / dt).toFixed(0)} fps` + (camOn ? `\n検出 ${(detCount / dt).toFixed(0)} fps  ${detMs.toFixed(0)} ms` : '');
      frames = 0; detCount = 0;
    }
  }

  // ------------------------------------------------------------------ レイアウト
  function layout() {
    const wrap = $('wrap'), r = wrap.getBoundingClientRect();
    let w = r.width, h = w / aspect;
    if (h > r.height) { h = r.height; w = h * aspect; }
    const st = $('stage'); st.style.width = Math.floor(w) + 'px'; st.style.height = Math.floor(h) + 'px';
    document.documentElement.style.setProperty('--ar', String(aspect));
    if (renderer) {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(Math.floor(w), Math.floor(h), false);
      camera.aspect = aspect; camera.updateProjectionMatrix();
    }
    dirty = true;
  }
  new ResizeObserver(layout).observe($('wrap'));

  // ------------------------------------------------------------------ カメラ + MediaPipe
  let mp = null, stream = null, busy = false, lastVT = -1;
  function loadScript(src) {
    return new Promise((res, rej) => {
      if (window.Hands) return res();
      const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
      s.onload = res; s.onerror = () => rej(new Error('MediaPipe を読み込めませんでした'));
      document.head.append(s);
    });
  }
  async function startCamera() {
    stopDemo();
    setMsg('カメラと手検出モデルを準備しています…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 }, facingMode: 'user' }, audio: false });
      const v = $('video'); v.srcObject = stream; await v.play();
      aspect = v.videoWidth / v.videoHeight || 4 / 3; layout();
      await loadScript(MP_BASE + 'hands.js');
      mp = new window.Hands({ locateFile: (f) => MP_BASE + f });
      mp.setOptions({ maxNumHands: 2, modelComplexity: S.complexity, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5, selfieMode: false });
      mp.onResults(onResults);
      await mp.initialize();
      camOn = true; $('btnCam').textContent = 'カメラを停止';
      setMsg(null);
      pump();
    } catch (e) {
      console.error(e);
      stopCamera();
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      setMsg(denied ? 'カメラが許可されていません。ブラウザのアドレスバーでカメラを許可してから、もう一度開始してください。'
                    : 'カメラを開始できませんでした: ' + (e && e.message ? e.message : e), [['もう一度試す', startCamera, true], ['デモ動作', startDemo]]);
    }
  }
  function pump() {
    if (!camOn) return;
    const v = $('video');
    if (!busy && v.readyState >= 2 && v.currentTime !== lastVT) {
      busy = true; lastVT = v.currentTime; const t0 = performance.now();
      mp.send({ image: v }).then(() => { detMs = performance.now() - t0; busy = false; }).catch((e) => { console.warn(e); busy = false; });
    }
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(pump); else requestAnimationFrame(pump);
  }
  function stopCamera() {
    camOn = false; busy = false;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; $('video').srcObject = null; $('btnCam').textContent = 'カメラを開始';
    for (const h of Object.values(hn)) h.lastSeen = -1;
    dirty = true;
  }
  function startDemo() { stopCamera(); demo = true; $('btnDemo').textContent = 'デモを停止'; setMsg(null); aspect = 4 / 3; layout(); }
  function stopDemo() { demo = false; $('btnDemo').textContent = 'デモ動作'; for (const h of Object.values(hn)) h.lastSeen = -1; dirty = true; }
  $('btnCam').addEventListener('click', () => (camOn ? (stopCamera(), setMsg('カメラを停止しました。', [['カメラを開始', startCamera, true], ['デモ動作', startDemo]]))
                                                       : startCamera()));
  $('btnDemo').addEventListener('click', () => (demo ? (stopDemo(), setMsg('カメラを開始するか、デモ動作で見た目を確認できます。', [['カメラを開始', startCamera, true], ['デモ動作', startDemo]])) : startDemo()));

  // ------------------------------------------------------------------ ファイル入出力
  function loadGlbBuffer(buf) { buildHands(buf); }
  $('fileGlb').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { loadGlbBuffer(await f.arrayBuffer()); } catch (err) { setMsg('GLBを読み込めませんでした: ' + err.message, [['閉じる', () => setMsg(null)]]); }
    e.target.value = '';
  });
  $('btnExport').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = 'hand_tracker_settings.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('fileCfg').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { Object.assign(S, JSON.parse(await f.text())); syncUI(); changed('all'); } catch (err) { setMsg('設定ファイルを読み込めませんでした。', [['閉じる', () => setMsg(null)]]); }
    e.target.value = '';
  });
  $('btnReset').addEventListener('click', () => { Object.assign(S, JSON.parse(JSON.stringify(DEFAULTS))); syncUI(); changed('all'); });

  // ------------------------------------------------------------------ 起動
  syncUI(); layout();
  try {
    THREE = await loadThree();
    setupScene(); layout();
  } catch (e) { setMsg(e.message); return; }
  requestAnimationFrame(frame);
  const startMsg = () => setMsg('カメラを開始するか、デモ動作で見た目を確認できます。', [['カメラを開始', startCamera, true], ['デモ動作', startDemo]]);
  try {
    const res = await fetch(GLB_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    buildHands(await res.arrayBuffer());
    startMsg();
  } catch (e) {
    console.warn(e);
    setMsg('hands_v3.glb を読み込めませんでした。ローカルサーバー経由で開くか、GLBファイルを選んでください。', [['GLBを選ぶ', () => $('fileGlb').click(), true]]);
    $('fileGlb').addEventListener('change', () => setTimeout(() => { if (hn.R) startMsg(); }, 500));
  }
  window.__app = { S, hn, onResults, startDemo, changed, get camera() { return camera; } };
})();
</script>
</body>
</html>
